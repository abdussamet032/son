version: 2

before:
  hooks:
    - go mod tidy

builds:
  - main: .
    binary: son
    ldflags:
      - -s -w -X github.com/abdussamet032/son/internal/config.Version={{.Version}}
    goos:
      - darwin
      - linux
    goarch:
      - amd64
      - arm64

archives:
  - formats: [tar.gz]
    name_template: "son_{{ .Version }}_{{ .Os }}_{{ .Arch }}"

brews:
  - repository:
      owner: abdussamet032
      name: homebrew-tap
      token: "{{ .Env.HOMEBREW_TAP_GITHUB_TOKEN }}"
    directory: Formula
    name: son
    homepage: "https://github.com/abdussamet032/son"
    description: "Developer workspace launcher — open the right repo in the right workspace"
    license: "MIT"
    install: |
      bin.install "son"
    test: |
      system "#{bin}/son", "version"
    commit_author:
      name: goreleaserbot
      email: bot@goreleaser.com
    commit_msg_template: "son {{ .Tag }}"

checksum:
  name_template: "checksums.txt"

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^ci:"
